<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>单图出片 · SelfLift</title>
<style>
:root{--bg:#f5f6f8;--card:#fff;--bd:#dfe3e8;--tx:#222;--mut:#888;--acc:#2b6cb0;--ok:#2f855a;--err:#c53030;--run:#d69e2e}
*{box-sizing:border-box}
body{margin:0;font:14px/1.6 -apple-system,"Segoe UI",Microsoft YaHei,sans-serif;background:var(--bg);color:var(--tx)}
header{background:#1a202c;color:#fff;padding:10px 20px;display:flex;align-items:center;gap:14px;
  flex-wrap:wrap;box-shadow:0 2px 10px -4px rgba(0,0,0,.55)}
header h1{font-size:16px;margin:0}header .bdg{font-size:11px;background:#2b6cb0;padding:2px 8px;border-radius:10px}
header .sp{flex:1}header a{color:#90cdf4;font-size:12px;text-decoration:none}
header a:hover{color:#bee3f8}
.wrap{max-width:980px;margin:18px auto;padding:0 16px}
.panel{background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:16px;margin-bottom:16px}
.panel h2{font-size:14px;margin:0 0 12px;color:#2d3748}
.row{display:flex;gap:12px;align-items:flex-end;flex-wrap:wrap;margin-bottom:12px}
.fld{display:flex;flex-direction:column;gap:4px;min-width:0;flex:1 1 180px}
.fld.sm{flex:0 1 150px}
label{font-size:12px;color:var(--mut)}
select,input[type=number],input[type=text],textarea{
  border:1px solid var(--bd);border-radius:5px;padding:7px 9px;font-size:13px;
  font-family:inherit;min-width:0;width:100%;background:#fff;color:var(--tx)}
textarea{min-height:130px;resize:vertical;line-height:1.6}
.hint{font-size:12px;color:var(--mut);margin:4px 0 0}
.res{font-size:13px;color:var(--acc);font-weight:600;white-space:nowrap;padding-bottom:8px}
button{border:1px solid var(--bd);background:#fff;border-radius:5px;padding:8px 15px;font-size:13px;cursor:pointer;color:var(--tx)}
button:hover{border-color:var(--acc);color:var(--acc)}
button.pri{background:var(--acc);color:#fff;border-color:var(--acc);font-weight:600}
button.pri:hover{background:#245b96;color:#fff}
button:disabled{opacity:.55;cursor:not-allowed}
#status{display:none;margin-top:12px;padding:10px;border-radius:5px;background:#f7fafc;border:1px solid var(--bd);font-size:13px}
#status.run{background:#fffaf0;border-color:#f6e05e}
#status.err{background:#fff5f5;border-color:#feb2b2}
#status.ok{background:#f0fff4;border-color:#9ae6b4}
#log{background:#1a202c;color:#cbd5e0;border-radius:5px;padding:10px;margin:8px 0 0;
  max-height:230px;overflow:auto;font:11px/1.55 Consolas,Monaco,monospace;white-space:pre-wrap;word-break:break-all}
.vgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.vcard{border:1px solid var(--bd);border-radius:6px;overflow:hidden;background:#fff;cursor:pointer}
.vcard:hover{border-color:var(--acc);box-shadow:0 2px 8px rgba(43,108,176,.15)}
.vcard video{width:100%;height:130px;object-fit:cover;background:#000;display:block}
.vcard .meta{padding:7px 9px;font-size:11px;color:var(--mut);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.empty{color:var(--mut);font-size:13px;padding:8px}
#modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.86);z-index:99;
  align-items:center;justify-content:center;flex-direction:column;gap:10px;padding:16px}
#modal video{max-width:100%;max-height:78vh;border-radius:6px;background:#000}
#modal .bar{color:#e2e8f0;font-size:12px;display:flex;gap:14px;align-items:center}
#modal .bar a{color:#90cdf4}
@media(max-width:640px){
  header{padding:9px 12px;gap:8px}
  .wrap{margin:12px auto;padding:0 10px}
  .panel{padding:12px}
  .fld,.fld.sm{flex:1 1 100%}
  .res{padding-bottom:0}
  #log{font-size:10px}
}
</style>
</head>
<body>
<header>
  <h1>单图出片</h1><span class="bdg" id="build">…</span>
  <span class="sp"></span>
  <a href="/h3-long-video/app" title="切到逐段出片台">出片台</a>
  <a href="/remake" title="切到复刻导演台">复刻台</a>
  <a href="/" title="返回工作台入口">工作台</a>
</header>

<div class="wrap">
  <div class="panel">
    <h2>生成一段视频</h2>
    <div class="row">
      <div class="fld">
        <label for="imgSel">参考图（来自 ComfyUI input 目录）</label>
        <select id="imgSel"></select>
      </div>
      <div class="fld sm">
        <label for="mp">百万像素 MP</label>
        <input id="mp" type="number" min="0.1" max="2" step="0.05" value="0.5">
      </div>
      <div class="fld sm">
        <label for="aspect">画幅比例</label>
        <select id="aspect"></select>
      </div>
      <div class="res" id="res">…</div>
    </div>
    <div class="row">
      <div class="fld sm">
        <label for="seed">Seed（留空随机）</label>
        <input id="seed" type="number" min="100001" placeholder="留空随机">
      </div>
      <div class="fld sm">
        <label for="seconds">时长（秒）</label>
        <input id="seconds" type="number" min="1" max="20" step="0.5" value="5">
      </div>
    </div>
    <div class="fld">
      <label for="prompt">提示词（用 &lt;Picture 1&gt; 指代上面选的参考图）</label>
      <textarea id="prompt" placeholder="例如：一名女子站在窗边，微微侧头看向镜头，光线柔和。镜头缓慢推近。"></textarea>
      <p class="hint">参考图自动绑定为 &lt;Picture 1&gt;——脸型、五官、发型、发色与身材比例全程一致。默认保留模型原生音轨，产物为带 audio 的 mp4。</p>
    </div>
    <div class="row" style="margin-top:12px">
      <button class="pri" id="genBtn">生成视频</button>
      <span class="hint" id="jobHint"></span>
    </div>
    <div id="status"></div>
    <div id="log" style="display:none"></div>
  </div>

  <div class="panel">
    <h2>已生成的视频 <span class="hint" style="font-weight:400">（ComfyUI output 中带 audio 的 mp4）</span></h2>
    <div class="row" style="margin-bottom:8px"><button id="refreshBtn">刷新列表</button></div>
    <div class="vgrid" id="vgrid"><div class="empty">加载中…</div></div>
  </div>
</div>

<div id="modal">
  <video id="modalVideo" controls playsinline></video>
  <div class="bar"><span id="modalName"></span><a href="#" id="modalClose">关闭 ✕</a></div>
</div>

<script>
const $ = id => document.getElementById(id);
const ASPECTS = [
  "1:1 (Square)","2:3 (Portrait Photo)","3:2 (Photo)","3:4 (Portrait Standard)",
  "4:3 (Standard)","9:16 (Portrait Widescreen)","16:9 (Widescreen)","21:9 (Ultrawide)"
];
const RATIOS = {
  "1:1 (Square)":[1,1],"2:3 (Portrait Photo)":[2,3],"3:2 (Photo)":[3,2],
  "3:4 (Portrait Standard)":[3,4],"4:3 (Standard)":[4,3],
  "9:16 (Portrait Widescreen)":[9,16],"16:9 (Widescreen)":[16,9],"21:9 (Ultrawide)":[21,9]
};
const state = {job:null, poll:null};

async function api(path, opts){
  const r = await fetch(path, Object.assign({cache:"no-store"}, opts||{}));
  const d = await r.json().catch(()=>({}));
  if(!r.ok || d.error) throw new Error(d.error || ("HTTP "+r.status));
  return d;
}

function calcRes(){
  // 只作松手前的即时显示，真值以后端 /resolution 为准（32 对齐，同节点 115）
  const mp = parseFloat($("mp").value) || 0.5;
  const [wr,hr] = RATIOS[$("aspect").value] || [16,9];
  const scale = Math.sqrt(mp*1024*1024/(wr*hr));
  const w = Math.round(wr*scale/32)*32, h = Math.round(hr*scale/32)*32;
  $("res").textContent = w + " × " + h;
}

async function loadImages(){
  try{
    const d = await api("/single/api/images");
    const sel = $("imgSel");
    sel.innerHTML = "";
    if(!d.images.length){
      const o=document.createElement("option");o.textContent="（input 目录没有图片）";o.value="";sel.appendChild(o);return;
    }
    d.images.forEach(im=>{
      const o=document.createElement("option");o.value=im.name;
      o.textContent=im.name+"  ("+(im.size/1048576).toFixed(1)+" MB)";
      sel.appendChild(o);
    });
  }catch(e){ $("res").textContent="图片列表加载失败"; }
}

function setStatus(kind, html){
  const el=$("status");el.className=kind||"";el.style.display=html?"block":"none";
  if(html) el.innerHTML=html;
}
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,
  c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));}
function fmtElapsed(sec){
  sec=Math.max(0,Math.floor(sec||0));
  return Math.floor(sec/60)+"分"+String(sec%60).padStart(2,"0")+"秒";
}
function showLog(text){
  const el=$("log");
  if(!text){el.style.display="none";el.textContent="";return;}
  const wasHidden=el.style.display==="none";
  const atBottom=el.scrollTop+el.clientHeight>=el.scrollHeight-40;
  el.style.display="block";
  el.textContent=text;
  if(wasHidden||atBottom) el.scrollTop=el.scrollHeight;   // 跟住尾部，用户上翻则不打扰
}

async function poll(){
  if(!state.job) return;
  try{
    const s = await api("/single/api/status?job="+encodeURIComponent(state.job));
    showLog(s.log);
    if(s.running){
      // ComfyUI 不给采样步数，诚实地显示阶段+耗时+日志行数，不编百分比
      const bits=["<b>生成中…</b>"];
      if(s.stage) bits.push(esc(s.stage));
      if(s.elapsed!=null) bits.push("已运行 "+fmtElapsed(s.elapsed));
      if(s.lines) bits.push(s.lines+" 行日志");
      setStatus("run",bits.join(" · "));
      return;
    }
    clearInterval(state.poll);state.poll=null;
    $("genBtn").disabled=false;
    if(s.error || s.returncode!==0){
      setStatus("err","<b>生成失败：</b>"+esc(s.error||("退出码 "+s.returncode))+
        (s.lines?" · "+s.lines+" 行日志（下方）":""));
    }else{
      setStatus("ok","<b>生成完成</b>"+(s.video?' · <a href="'+esc(s.video_url)+
        '" target="_blank">打开视频</a>':""));
      loadVideos();
    }
  }catch(e){
    clearInterval(state.poll);state.poll=null;$("genBtn").disabled=false;
    setStatus("err","查询状态失败："+esc(e.message));
  }
}

$("genBtn").addEventListener("click", async ()=>{
  const image=$("imgSel").value, prompt=$("prompt").value.trim();
  if(!image){ setStatus("err","先在 input 目录放一张参考图"); return; }
  if(!prompt){ setStatus("err","提示词不能为空"); return; }
  const payload={image, prompt, mp:parseFloat($("mp").value),
    aspect:$("aspect").value, seconds:parseFloat($("seconds").value)};
  const seed=parseInt($("seed").value,10);
  if(seed) payload.seed=seed;
  $("genBtn").disabled=true;
  try{
    const d=await api("/single/api/generate",{method:"POST",
      headers:{"Content-Type":"application/json"},body:JSON.stringify(payload)});
    state.job=d.job;
    $("jobHint").textContent="seed "+d.seed+" · "+d.resolution.width+"×"+d.resolution.height;
    setStatus("run","<b>已提交</b> "+d.job);
    clearInterval(state.poll);
    state.poll=setInterval(poll,2000);poll();
  }catch(e){
    $("genBtn").disabled=false;setStatus("err",e.message);
  }
});

async function loadVideos(){
  try{
    const d=await api("/single/api/videos");
    $("build").textContent=d.build||"";
    const grid=$("vgrid");
    if(!d.videos.length){grid.innerHTML='<div class="empty">还没有带 audio 的视频</div>';return;}
    grid.innerHTML="";
    d.videos.forEach(v=>{
      const card=document.createElement("div");card.className="vcard";
      const vd=document.createElement("video");
      vd.src="/single/video?name="+encodeURIComponent(v.name);
      vd.preload="metadata";vd.muted=true;vd.playsInline=true;
      const meta=document.createElement("div");meta.className="meta";
      const dt=new Date(v.mtime*1000);
      meta.textContent=v.name+" · "+(v.size/1048576).toFixed(1)+"MB · "+
        dt.toLocaleString("zh-CN",{month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit"});
      card.appendChild(vd);card.appendChild(meta);
      card.addEventListener("click",()=>openModal(v.name,vd.src));
      grid.appendChild(card);
    });
  }catch(e){ $("vgrid").innerHTML='<div class="empty">列表加载失败：'+e.message+'</div>'; }
}

function openModal(name, src){
  $("modalName").textContent=name;
  $("modalVideo").src=src;
  $("modal").style.display="flex";
  $("modalVideo").play().catch(()=>{});
}
function closeModal(){
  $("modalVideo").pause();$("modalVideo").src="";$("modal").style.display="none";
}
$("modalClose").addEventListener("click",e=>{e.preventDefault();closeModal();});
$("modal").addEventListener("click",e=>{if(e.target===$("modal"))closeModal();});
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeModal();});

$("aspect").innerHTML=ASPECTS.map(a=>'<option value="'+a+'"'+
  (a==="16:9 (Widescreen)"?" selected":"")+">"+a+"</option>").join("");
$("mp").addEventListener("input",calcRes);
$("aspect").addEventListener("change",calcRes);
$("refreshBtn").addEventListener("click",loadVideos);
calcRes();loadImages();loadVideos();
</script>
</body>
</html>
